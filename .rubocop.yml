AllCops:
  NewCops: enable

# brew style --fix already formats this codebase to Homebrew's own
# conventions; let it own formatting instead of fighting rubocop's defaults.
Layout:
  Enabled: false

Style:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false
